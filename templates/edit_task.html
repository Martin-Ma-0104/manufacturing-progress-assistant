{% extends "base.html" %}

{% block title %}Edit Task - Manufacturing Progress Assistant{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Edit Task</h1>
        <p class="text-muted mb-0">{{ task.title }}</p>
    </div>
</div>

<form class="panel" method="post">
    {% include "_task_form.html" %}
    <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Update Task</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('task_detail', task_id=task.id) }}">Cancel</a>
    </div>
</form>
{% endblock %}
